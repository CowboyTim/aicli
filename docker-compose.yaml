# The broker: it starts the dev pods of the projects, through the rootless Podman
# of the host. It is the only container that has the engine socket; the agent
# containers get the broker's socket from the volume aicli-broker, and nothing else.
#
#   AI_PROJECTS     the host directory of the projects (the root; its subdirectories are the projects)
#   PODMAN_SOCKET   the rootless Podman socket of the user that runs the broker
#   BROKER_UID      that user's UID (the owner of the socket; the agents run as the same UID)
#   BROKER_GID      its GID
#
#   ./deploy.sh                          the IPv6 network, then docker compose up -d --build
#   the page: https://PUBLIC_DOMAIN/?token=... (the token is in its log: docker compose logs agent)
name: aicli-broker
services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
    image: local/ai/aicli-broker:latest
    user: "${BROKER_UID:-1000}:${BROKER_GID:-1000}"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AI_BROKER_CONFIG: /etc/aicli/broker.json
      AI_BROKER_HOST_ROOT: ${AI_PROJECTS:?set AI_PROJECTS to the host directory of the projects}
      AI_BROKER_SOCKET: /run/aicli-broker/broker.sock
      AI_BROKER_ENGINE: /run/engine/podman.sock
      CONTAINER_HOST: unix:///run/engine/podman.sock
    volumes:
      - ./broker.json:/etc/aicli/broker.json:ro
      - ${PODMAN_SOCKET:?set PODMAN_SOCKET to the rootless Podman socket}:/run/engine/podman.sock
      - ${AI_PROJECTS}:/projects:ro
      - aicli-broker:/run/aicli-broker
    restart: unless-stopped
  # The agent: the web interface (ai.pl --ui) with its projects. It is what
  # `aicli.sh --broker --root $AI_PROJECTS --ui` starts by hand. Its provider settings
  # (AI_API_KEY, AI_PROVIDER, AI_MODEL, AI_LOCAL_SERVER, AI_UI_TOKEN, ...) go in
  # .agent.env, next to this file (deploy.sh writes it); it is optional.
  agent:
    build:
      context: .
      target: dev
    image: local/ai/aicli:latest
    depends_on:
      - broker
      - searxng
      - proxy
    networks:
      - aicli
    command:
      - --ui=${AGENT_PORT:-8080}
      - --ui-bind=0.0.0.0
    env_file:
      - path: ./.agent.env
        required: false
    environment:
      # the agent's web tools go through the proxy, its search is the searxng of this file
      AI_WEB_PROXY: http://proxy:3128
      # the secret nginx sends after its login check (see nginx/nginx.conf.template)
      AI_GATE_SECRET: ${AICLI_GATE_SECRET:?set AICLI_GATE_SECRET (deploy.sh makes it)}
      # the public name (nginx): the page prints its address, and the QR code is for it
      AI_PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      AI_SEARXNG_URL: http://searxng:8080
      AI_SEARXNG_PROXY: ""
      UID: ${BROKER_UID:-1000}
      GID: ${BROKER_GID:-1000}
      HOME: /workspace
      AI_DIR: /workspace/.aicli
      AI_PROMPT_TEMPLATE: coder
      AI_POD_ROOT: /workdir/projects
      AI_BROKER_SOCKET: /run/aicli-broker/broker.sock
      TMPDIR: /tmp
    working_dir: /workdir/projects
    volumes:
      - ${AI_PROJECTS:?set AI_PROJECTS to the host directory of the projects}:/workdir/projects
      - aicli-agent:/workspace
      - aicli-broker:/run/aicli-broker
    tmpfs:
      - /tmp:size=2G
      - /var/tmp:size=1G
    cap_add:
      - SYS_PTRACE
    restart: unless-stopped
  # auth: the logins (PAM, the accounts of this container, kept in the volume:
  #   docker compose exec -it auth perl /usr/local/lib/aicli/auth.pl user add NAME aicli-user)
  # and the JWT that nginx checks (auth_request). No port is published: nginx reaches it on aicli-net.
  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    image: local/ai/aicli-auth:latest
    networks:
      - aicli
    environment:
      AI_AUTH_LISTEN: 0.0.0.0:9000
      # a token lasts an hour and is renewed while in use; a session lasts a month (then a login)
      AI_AUTH_LIFETIME: ${AI_AUTH_LIFETIME:-3600}
      AI_AUTH_SESSION_MAX: ${AI_AUTH_SESSION_MAX:-2592000}
    volumes:
      - aicli-auth:/var/lib/aicli-auth
    # all capabilities dropped, but the three the account tools need to rewrite /etc/passwd and
    # /etc/shadow (the owner and group of the new files, and writing files of root)
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  # searxng: the search engine of the agent's search tool (JSON output, see searxng/settings.yml)
  searxng:
    image: searxng/searxng:latest
    networks:
      - aicli
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET (openssl rand -hex 32)}
      SEARXNG_BASE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}/searxng/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  # proxy: squid, the agent's way to the web (fetch and search); see proxy/squid.conf
  proxy:
    image: ubuntu/squid:latest
    networks:
      - aicli
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
    restart: unless-stopped

  # nginx: the public address, TLS on port 443 with the certificate of certbot. The
  # certificate is made by deploy.sh (certbot runs there, on the address of the domain, as
  # its own container: it answers the HTTP challenge on port 80). nginx waits for the
  # certificate, and reloads when the config changes (renewal).
  nginx:
    image: nginx:stable
    networks:
      dmz:
        ipv6_address: ${IPV6_ADDRESS:?set IPV6_ADDRESS (deploy.sh looks it up from PUBLIC_DOMAIN)}
      aicli: {}
    depends_on:
      - agent
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN to the public name}
      AGENT_PORT: ${AGENT_PORT:-8080}
      SEARXNG_API_TOKEN: ${SEARXNG_API_TOKEN:?set SEARXNG_API_TOKEN (openssl rand -hex 32)}
      AICLI_GATE_SECRET: ${AICLI_GATE_SECRET:?set AICLI_GATE_SECRET (deploy.sh makes it)}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until [ -d /etc/nginx/certs/live/$$PUBLIC_DOMAIN ]; do
          echo "no certificate for $$PUBLIC_DOMAIN yet (run deploy.sh with DO_CERTBOT=1)"; sleep 30
        done
        envsubst '$$PUBLIC_DOMAIN $$AGENT_PORT $$SEARXNG_API_TOKEN $$AICLI_GATE_SECRET' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        (while :; do sleep 60
          envsubst '$$PUBLIC_DOMAIN $$AGENT_PORT $$SEARXNG_API_TOKEN $$AICLI_GATE_SECRET' < /etc/nginx/nginx.conf.template > /tmp/nginx.new
          if ! cmp -s /tmp/nginx.new /etc/nginx/nginx.conf; then cp /tmp/nginx.new /etc/nginx/nginx.conf; nginx -s reload; fi
        done) &
        exec nginx -g 'daemon off;'
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - letsencrypt:/etc/nginx/certs:ro
      # the static files: the login page and its stylesheet (the other pages are the agent's)
      - ./ai/ui:/etc/nginx/ui:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    restart: unless-stopped

networks:
  # the public IPv6 network (deploy.sh creates it): only nginx is on it
  dmz:
    name: dmz-aicli
    external: true
  # the containers among themselves, and their way out (NAT, both families; see deploy notes)
  aicli:
    name: aicli-net
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: "nat"
      com.docker.network.bridge.gateway_mode_ipv6: "nat"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_ip6_masquerade: "true"
      com.docker.network.bridge.inhibit_ipv4: "false"
    ipam:
      config:
        - subnet: 172.31.200.0/24
        - subnet: fd42:a1c1::/64

volumes:
  aicli-broker:
    name: aicli-broker
  aicli-agent:
    name: aicli-agent
  aicli-auth:
    name: aicli-auth
  letsencrypt:
    name: aicli-letsencrypt
