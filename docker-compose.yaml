# The broker: it starts the dev pods of the projects, through the rootless Podman
# of the host. It is the only container that has the engine socket; the agent
# containers get the broker's socket from the volume aicli-broker, and nothing else.
#
#   AI_PROJECTS     the host directory of the projects (the root; its subdirectories are the projects)
#   PODMAN_SOCKET   the rootless Podman socket of the user that runs the broker
#   BROKER_UID      that user's UID (the owner of the socket; the agents run as the same UID)
#   BROKER_GID      its GID
#
#   docker compose up -d --build        the broker and the agent (the web interface)
#   the agent's page: http://127.0.0.1:8080/?token=... (the token is in its log: docker compose logs agent)
name: aicli-broker
services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
    image: local/ai/aicli-broker:latest
    user: "${BROKER_UID:-1000}:${BROKER_GID:-1000}"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AI_BROKER_CONFIG: /etc/aicli/broker.json
      AI_BROKER_HOST_ROOT: ${AI_PROJECTS:?set AI_PROJECTS to the host directory of the projects}
      AI_BROKER_SOCKET: /run/aicli-broker/broker.sock
      AI_BROKER_ENGINE: /run/engine/podman.sock
      CONTAINER_HOST: unix:///run/engine/podman.sock
    volumes:
      - ./broker.json:/etc/aicli/broker.json:ro
      - ${PODMAN_SOCKET:?set PODMAN_SOCKET to the rootless Podman socket}:/run/engine/podman.sock
      - ${AI_PROJECTS}:/projects:ro
      - aicli-broker:/run/aicli-broker
    restart: unless-stopped
  # The agent: the web interface (ai.pl --ui) with its projects. It is what
  # `aicli.sh --broker --root $AI_PROJECTS --ui` starts by hand. Its provider settings
  # (AI_API_KEY, AI_PROVIDER, AI_MODEL, AI_LOCAL_SERVER, AI_UI_TOKEN, ...) go in
  # agent.env, next to this file; it is optional.
  agent:
    build:
      context: .
      target: dev
    image: local/ai/aicli:latest
    depends_on:
      - broker
    network_mode: host
    command:
      - --ui=${AGENT_PORT:-8080}
      - --ui-bind=${AGENT_BIND:-127.0.0.1}
    env_file:
      - path: ./agent.env
        required: false
    environment:
      UID: ${BROKER_UID:-1000}
      GID: ${BROKER_GID:-1000}
      HOME: /workspace
      AI_DIR: /workspace/.aicli
      AI_PROMPT_TEMPLATE: coder
      AI_POD_ROOT: /workdir/projects
      AI_BROKER_SOCKET: /run/aicli-broker/broker.sock
      TMPDIR: /tmp
    working_dir: /workdir/projects
    volumes:
      - ${AI_PROJECTS:?set AI_PROJECTS to the host directory of the projects}:/workdir/projects
      - aicli-agent:/workspace
      - aicli-broker:/run/aicli-broker
    tmpfs:
      - /tmp:size=2G
      - /var/tmp:size=1G
    cap_add:
      - SYS_PTRACE
    restart: unless-stopped
  # certbot: the certificate for PUBLIC_DOMAIN, through a DNS record (DNS_PLUGIN and the
  # credentials of dns-credentials.ini). It gets the certificate once, then renews it.
  certbot:
    build:
      context: .
      dockerfile: Dockerfile.certbot
      args:
        DNS_PLUGIN: ${DNS_PLUGIN:-cloudflare}
    image: local/ai/aicli-certbot:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -d /etc/letsencrypt/live/$$PUBLIC_DOMAIN ]; then
          certbot certonly --non-interactive --agree-tos -m "$$CERTBOT_EMAIL" -d "$$PUBLIC_DOMAIN" \
            --dns-$$DNS_PLUGIN --dns-$$DNS_PLUGIN-credentials /run/secrets/dns.ini
        fi
        while :; do certbot renew --quiet; sleep 12h; done
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN to the public name}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?set CERTBOT_EMAIL (for the certificate's notices)}
      DNS_PLUGIN: ${DNS_PLUGIN:-cloudflare}
    volumes:
      - ./dns-credentials.ini:/run/secrets/dns.ini:ro
      - letsencrypt:/etc/letsencrypt
    restart: unless-stopped

  # nginx: the public address. TLS with the certificate of certbot; the agent is behind it
  # on the loopback. Start certbot first and wait for its certificate (docker compose logs certbot).
  nginx:
    image: nginx:stable
    network_mode: host
    depends_on:
      - agent
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN to the public name}
      AGENT_PORT: ${AGENT_PORT:-8080}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        envsubst '$$PUBLIC_DOMAIN $$AGENT_PORT' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
        (while :; do sleep 12h; nginx -s reload; done) &
        exec nginx -g 'daemon off;'
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  aicli-broker:
    name: aicli-broker
  aicli-agent:
    name: aicli-agent
  letsencrypt:
    name: aicli-letsencrypt
