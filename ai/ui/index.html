<!doctype html>
<html lang="en" data-look="simple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aicli</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  /*theme.css*/

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }

  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; justify-content: space-between;
           padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--bg); color: var(--muted); font-size: 13px; }
  header select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; max-width: 100%; }
  #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  /* the menu: the model, the look and the theme, behind the ☰ button, on phones and desktops */
  #menu-btn { padding: 4px 8px; font-size: 18px; line-height: 1; }
  #menu-btn svg { width: 20px; height: 20px; fill: currentColor; display: block; }
  #menu { display: none; position: absolute; top: 100%; right: 0; left: 0; z-index: 3; background: var(--bg);
          border-bottom: 1px solid var(--line); padding: 12px 16px; flex-direction: column; gap: 10px; box-shadow: 0 6px 16px rgba(0,0,0,.15); }
  #menu.open { display: flex; }
  #qrnew, #qrclose { align-self: flex-start; font: inherit; font-size: 14px; padding: 4px 10px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  #qrbox { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  #qrbox[hidden] { display: none; }
  #qrimg { width: 220px; height: 220px; background: #fff; padding: 8px; border-radius: 6px; }
  #qrnote { font-size: 13px; color: var(--muted); }
  #renamesession { align-self: flex-start; font: inherit; font-size: 14px; padding: 4px 10px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  #delsession { align-self: flex-start; font: inherit; font-size: 14px; padding: 4px 10px; color: var(--err); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  #logout { align-self: flex-start; font: inherit; font-size: 14px; padding: 4px 10px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  #menu label { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; }
  #menu select { flex: 1; min-width: 0; max-width: 70%; font-size: 15px; }
  #model, #session, #project { max-width: 100% !important; }
  .projadmin { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .projadmin input { min-width: 0; width: 9em; }
  /* the menu is as wide as the screen on a phone: long words (a UUID, a token, a URL) wrap here,
     they never widen the menu (a horizontal scrollbar) */
  #menu, #menu > * { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
  #agents { flex: 1 1 100%; font-size: 13px; color: var(--muted); }
  #agents .agenthead { margin-bottom: 4px; }
  #agents ul { list-style: none; margin: 0; padding: 0; }
  #agents li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0; }
  #agents li > span { min-width: 0; flex: 1 1 auto; overflow-wrap: anywhere; }
  #agents button { font-size: 13px; padding: 2px 8px; flex: 0 0 auto; }
  #agents .job { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
  #agents .job select, #agents .job input { min-width: 0; font-size: 13px; }
  #agents .job input { flex: 1 1 8em; }
  #agents .job #jobcmd { flex: 2 1 12em; font-family: monospace; }
  #agents #joboutput { flex: 1 1 100%; width: 100%; margin: 0; max-height: 16em; overflow: auto; white-space: pre-wrap; font-size: 12px; border: 1px solid var(--line); padding: 6px; }
  #agents .online { font-weight: bold; color: var(--fg); }
  #agents .offline { color: var(--muted); }
  #agents .enroll { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  #agents .enroll input { flex: 1 1 0; width: 0; min-width: 0; font-family: monospace; font-size: 12px; }
  #agents .enroll[hidden] { display: none; }
  #session option { max-width: 40em; }
  @media (min-width: 700px) { #menu { left: auto; width: 340px; border-left: 1px solid var(--line); } }

  main { max-width: 960px; margin: 0; padding: 16px; } /* left: the text starts at the left edge */
  #log { overflow-wrap: anywhere; }
  .msg { margin: 0 0 14px; white-space: pre-wrap; }
  /* an answer is markdown: the line breaks come from the markdown, not the source */
  .answer { white-space: normal; overflow-wrap: anywhere; }
  .answer p { margin: 0 0 0.7em; }
  .answer h1, .answer h2, .answer h3, .answer h4, .answer h5, .answer h6 { margin: 0.9em 0 0.4em; font-size: 1em; line-height: 1.3; }
  .answer h1 { font-size: 1.25em; } .answer h2 { font-size: 1.12em; }
  .answer ul, .answer ol { margin: 0 0 0.7em 1.4em; padding: 0; }
  .answer li { margin: 0.15em 0; }
  .answer blockquote { margin: 0 0 0.7em; padding: 0 0 0 0.8em; border-left: 3px solid var(--line); color: var(--muted); }
  .answer hr { border: none; border-top: 1px solid var(--line); margin: 0.9em 0; }
  .answer .table-wrap { overflow-x: auto; margin: 0 0 0.7em; max-width: 100%; }
  .answer table { border-collapse: collapse; font-size: 0.95em; }
  .answer th, .answer td { border: 1px solid var(--line); padding: 0.3em 0.6em; vertical-align: top; text-align: left; }
  .answer th { font-weight: 600; }
  .answer pre { margin: 0 0 0.7em; padding: 8px 10px; background: var(--user-bg); border-radius: 6px; overflow-x: auto; white-space: pre; }
  .answer code { font-family: var(--mono); font-size: 0.92em; }
  .answer :not(pre) > code { background: var(--user-bg); padding: 0 0.3em; border-radius: 3px; }
  .answer a { color: var(--accent); }
  .error { color: var(--err); }
  /* thinking: a spinner and the count while it thinks, a click shows the text */
  .thinking { margin-bottom: 10px; }
  html[data-look] .think-head { background: none; border: none; padding: 0; margin: 0; color: var(--muted);
           font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
  html[data-look] .think-head:hover { color: var(--fg); }
  .think-spin { display: inline-block; width: 1.4em; font-family: var(--mono); }
  .think-body { color: var(--muted); font-style: italic; font-size: 14px; white-space: normal;
                margin: 6px 0 0 1.4em; padding-left: 10px; border-left: 2px solid var(--line); }
  .tool { color: var(--accent); font-size: 13px; margin-top: 8px; }
  .result { color: var(--muted); font-size: 13px; margin-left: 1.5em; }
  .usage { color: var(--muted); font-size: 13px; }
  /* the tag of an answer: its usage, and a revert (the exchange goes out of the chat) */
  .tag { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .tag button { font: inherit; font-size: 12px; padding: 1px 8px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  /* waiting: a spinner and the seconds while a request has no answer yet */
  .wait { color: var(--muted); font-size: 13px; margin: 0 0 8px; }

  /* simple: the terminal */
  html[data-look="simple"] body { font-family: var(--mono); font-size: 16px; line-height: 1.5; }
  html[data-look="simple"] header { font-family: var(--mono); }
  html[data-look="simple"] .user { color: var(--accent); margin-top: 18px; }
  html[data-look="simple"] .user::before { content: "> "; color: var(--muted); }
  html[data-look="simple"] .answer { margin-bottom: 4px; }
  html[data-look="simple"] form { font-family: var(--mono); }
  html[data-look="simple"] textarea { font: inherit; font-size: 16px; border: none; border-top: 1px solid var(--line); border-radius: 0; padding: 10px 0 0; }

  /* cards: bubbles */
  html[data-look="cards"] .user { background: var(--user-bg); padding: 8px 12px; border-radius: 8px; }
  html[data-look="cards"] .answer { padding: 0 2px; }

  form { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; background: var(--bg); position: sticky; bottom: 0; }
  textarea { width: 100%; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); resize: vertical; min-height: 44px; }
  button { font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  /* the icon buttons under the text: small, in a row at the right */
  .bar { display: flex; justify-content: flex-end; gap: 6px; }
  button.icon { width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: none; background: none; color: var(--muted); }
  button.icon:hover:not(:disabled) { color: var(--fg); background: var(--user-bg); }
  button.icon svg { width: 18px; height: 18px; fill: currentColor; display: block; }
  button.icon.rec { color: var(--err); }
  html[data-look] button.icon { border: none; background: none; padding: 0 0; }
  html[data-look] button.icon:hover:not(:disabled) { background: var(--user-bg); }
  @media (max-width: 600px) { header { padding: 8px 12px; } main { padding: 12px; } }
</style>
</head>
<body>
<header>
  <span id="status">connecting…</span>
  <button id="menu-btn" type="button" aria-expanded="false" aria-controls="menu" title="menu" aria-label="menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
  </button>
  <div id="menu">
    <label>model <select id="model" aria-label="model" title="model"></select></label>
    <label>project <select id="project" aria-label="project" title="project"></select></label>
    <div class="projadmin">
      <label>new project <input id="newproject" aria-label="new project name" placeholder="name" maxlength="63" autocomplete="off"></label>
      <button type="button" id="projcreate">create</button>
      <button type="button" id="projrename">rename</button>
      <button type="button" id="projdelete">delete</button>
    </div>
    <label>session <select id="session" aria-label="session" title="session"></select></label>
    <label>look <select id="look" aria-label="look">
      <option value="simple">simple</option>
      <option value="cards">cards</option>
    </select></label>
    <div id="agents">
      <div class="agenthead">agents <button type="button" id="agentnew">new enrollment token</button> <span id="agentnote"></span></div>
      <div class="enroll" id="agentenroll" hidden>
        <input id="agenttoken" readonly aria-label="enrollment token">
        <button type="button" id="agentcopy">copy</button>
      </div>
      <ul id="agentlist"></ul>
      <div class="agenthead">run on an agent: a project's job for the agents with these tags</div>
      <div class="job">
        <select id="jobproject" aria-label="project of the job"></select>
        <input id="jobtags" placeholder="tags, e.g. bash" aria-label="tags of the job">
        <input id="jobcmd" placeholder="program and arguments, e.g. perl -v" aria-label="command of the job">
        <button type="button" id="jobrun">run</button>
        <span id="jobnote"></span>
        <pre id="joboutput" hidden></pre>
      </div>
      <div class="agenthead">API token <button type="button" id="apinew">new API token</button> <span id="apinote"></span></div>
      <div class="enroll" id="apienroll" hidden>
        <input id="apitokenbox" readonly aria-label="API token">
        <button type="button" id="apicopy">copy</button>
      </div>
    </div>
    <label>theme <select id="theme" aria-label="theme">
      <option value="system">system</option>
      <option value="light">light</option>
      <option value="dark">dark</option>
      <option value="amber">amber</option>
      <option value="matrix">matrix</option>
      <option value="solarized">solarized</option>
      <option value="paper">paper</option>
      <option value="neon">neon</option>
    </select></label>
    <button id="logout" type="button">log out</button>
    <button id="qrnew" type="button">log in on another device</button>
    <div id="qrbox" hidden>
      <img id="qrimg" alt="QR code: scan it with the phone">
      <div id="qrnote"></div>
      <button id="qrclose" type="button">close</button>
    </div>
    <button id="renamesession" type="button">rename this session</button>
    <button id="delsession" type="button">delete this session</button>
  </div>
</header>
<main>
  <div id="log"></div>
  <div id="wait" class="wait" hidden><span id="wait-spin" class="think-spin"></span><span id="wait-label"></span></div>
  <form id="form">
    <textarea id="text" rows="2" placeholder="Message" aria-label="message" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"></textarea>
    <div class="bar">
      <button id="mic" class="icon" type="button" aria-pressed="false" title="speak (click to start, click to stop)" aria-label="speak">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <button id="abort" class="icon" type="button" disabled title="stop" aria-label="stop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      </button>
      <button id="send" class="icon" type="submit" title="send" aria-label="send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5l18-8-8 18-2-8-8-2z"/></svg>
      </button>
    </div>
  </form>
</main>
<script>
(function () {
  "use strict";
  var log = document.getElementById("log");
  var status = document.getElementById("status");
  var model = document.getElementById("model");
  var session = document.getElementById("session");
  var project = document.getElementById("project");
  var agentlist = document.getElementById("agentlist");
  var jobproject = document.getElementById("jobproject");
  var agentnote = document.getElementById("agentnote");
  var agentenroll = document.getElementById("agentenroll");
  var agenttoken = document.getElementById("agenttoken");
  var form = document.getElementById("form");
  var text = document.getElementById("text");
  var send = document.getElementById("send");
  var abort = document.getElementById("abort");
  var look = document.getElementById("look");
  var mic = document.getElementById("mic");
  var rec = null; // the recording in progress: {stream, ctx, src, proc, chunks}
  var current = null;  // the element the answer streams into

  // the look is a per-browser choice, remembered when the browser allows it
  function setLook(name) {
    if (name !== "cards") { name = "simple"; }
    document.documentElement.setAttribute("data-look", name);
    look.value = name;
    try { localStorage.setItem("aicli-look", name); } catch (e) { /* no storage: the default */ }
  }
  var saved = null;
  try { saved = localStorage.getItem("aicli-look"); } catch (e) { /* no storage */ }
  setLook(saved || "simple");
  look.addEventListener("change", function () { setLook(look.value); });

  // the theme: the system's by default; a name of the list when chosen
  // (remembered). The model may pick one too, then it is not remembered.
  var THEMES = ["system", "light", "dark", "amber", "matrix", "solarized", "paper", "neon"];
  var theme = document.getElementById("theme");
  function setTheme(name, remember) {
    if (THEMES.indexOf(name) < 0) { name = "system"; }
    if (name === "system") { document.documentElement.removeAttribute("data-theme"); }
    else { document.documentElement.setAttribute("data-theme", name); }
    theme.value = name;
    if (remember === false) { return; }
    try { localStorage.setItem("aicli-theme", name); } catch (e) { /* no storage: the system's */ }
  }
  var savedTheme = null;
  try { savedTheme = localStorage.getItem("aicli-theme"); } catch (e) { /* no storage */ }
  setTheme(savedTheme || "system");
  theme.addEventListener("change", function () { setTheme(theme.value); });

  // Markdown of an answer, as DOM nodes: never HTML from the text. Blocks:
  // headings, paragraphs, lists, tables, quotes, rules, fenced code. Inline: code, bold,
  // italic, links (http and https only). Anything else is plain text.
  function el(tag) { return document.createElement(tag); }
  function txt(s) { return document.createTextNode(s); }
  var INLINE = /`([^`\n]+)`|\*\*([^*\n]+)\*\*|(?<![\w])__([^_\n]+)__(?!\w)|\*([^*\s][^*\n]*)\*|(?<![\w])_([^_\s][^_\n]*)_(?!\w)|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g;
  function inline(s, parent) {
    // its own copy of the pattern: inline() calls itself for bold and italic
    var re = new RegExp(INLINE.source, "g"), last = 0, m;
    while ((m = re.exec(s)) !== null) {
      if (m.index > last) { parent.appendChild(txt(s.slice(last, m.index))); }
      var node;
      if (m[1] !== undefined) { node = el("code"); node.textContent = m[1]; }
      else if (m[2] !== undefined || m[3] !== undefined) { node = el("strong"); inline(m[2] !== undefined ? m[2] : m[3], node); }
      else if (m[4] !== undefined || m[5] !== undefined) { node = el("em"); inline(m[4] !== undefined ? m[4] : m[5], node); }
      else { node = el("a"); node.href = m[7]; node.target = "_blank"; node.rel = "noopener noreferrer"; node.textContent = m[6]; }
      parent.appendChild(node);
      last = re.lastIndex;
    }
    if (last < s.length) { parent.appendChild(txt(s.slice(last))); }
  }
  var RE_FENCE = /^\s*```/, RE_HEAD = /^(#{1,6})\s+(.*)$/, RE_HR = /^\s*(---|\*\*\*|___)\s*$/,
      RE_QUOTE = /^>\s?/, RE_ITEM = /^(\s*)([-*+]|\d+\.)\s+(.*)$/, RE_BLANK = /^\s*$/;
  function startsBlock(l) {
    return RE_FENCE.test(l) || RE_HEAD.test(l) || RE_HR.test(l) || RE_QUOTE.test(l) || RE_ITEM.test(l);
  }
  // a table: a row with pipes, and under it a delimiter row (| --- | :-: |)
  var RE_TSEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
  function tableAt(lines, i) {
    return i + 1 < lines.length && lines[i].indexOf("|") >= 0 && !RE_BLANK.test(lines[i]) &&
      lines[i + 1].indexOf("|") >= 0 && RE_TSEP.test(lines[i + 1]);
  }
  // the cells of a row; \| is a pipe inside a cell
  function cells(l) {
    var s = l.trim();
    if (s.charAt(0) === "|") { s = s.slice(1); }
    if (s.slice(-1) === "|" && s.slice(-2) !== "\\|") { s = s.slice(0, -1); }
    return s.split(/(?<!\\)\|/).map(function (c) { return c.trim().replace(/\\\|/g, "|"); });
  }
  function alignOf(c) {
    var l = c.charAt(0) === ":", r = c.slice(-1) === ":";
    return l && r ? "center" : r ? "right" : l ? "left" : "";
  }
  function blocks(src, parent) {
    var lines = src.split("\n"), i = 0;
    while (i < lines.length) {
      var line = lines[i], m;
      if (RE_FENCE.test(line)) {
        var code = [];
        i++;
        while (i < lines.length && !RE_FENCE.test(lines[i])) { code.push(lines[i]); i++; }
        i++; // the closing fence, or the end of what has come so far
        var pre = el("pre"), c = el("code");
        c.textContent = code.join("\n");
        pre.appendChild(c);
        parent.appendChild(pre);
        continue;
      }
      if ((m = RE_HEAD.exec(line))) {
        var h = el("h" + m[1].length);
        inline(m[2], h);
        parent.appendChild(h);
        i++;
        continue;
      }
      if (RE_HR.test(line)) { parent.appendChild(el("hr")); i++; continue; }
      if (tableAt(lines, i)) {
        var aligns = cells(lines[i + 1]).map(alignOf);
        var table = el("table"), thead = el("thead"), hrow = el("tr");
        cells(lines[i]).forEach(function (c, k) {
          var th = el("th");
          th.style.textAlign = aligns[k] || "";
          inline(c, th);
          hrow.appendChild(th);
        });
        thead.appendChild(hrow);
        table.appendChild(thead);
        var tbody = el("tbody");
        i += 2;
        while (i < lines.length && !RE_BLANK.test(lines[i]) && lines[i].indexOf("|") >= 0) {
          var row = el("tr");
          cells(lines[i]).forEach(function (c, k) {
            var td = el("td");
            td.style.textAlign = aligns[k] || "";
            inline(c, td);
            row.appendChild(td);
          });
          tbody.appendChild(row);
          i++;
        }
        table.appendChild(tbody);
        var wrap = el("div");
        wrap.className = "table-wrap";
        wrap.appendChild(table);
        parent.appendChild(wrap);
        continue;
      }
      if (RE_QUOTE.test(line)) {
        var q = [];
        while (i < lines.length && RE_QUOTE.test(lines[i])) { q.push(lines[i].replace(RE_QUOTE, "")); i++; }
        var bq = el("blockquote");
        blocks(q.join("\n"), bq);
        parent.appendChild(bq);
        continue;
      }
      if ((m = RE_ITEM.exec(line))) {
        var ordered = /\d/.test(m[2]);
        var list = el(ordered ? "ol" : "ul");
        while (i < lines.length) {
          var n = RE_ITEM.exec(lines[i]);
          if (!n || /\d/.test(n[2]) !== ordered) { break; }
          var li = el("li");
          inline(n[3], li);
          list.appendChild(li);
          i++;
          // an indented line that is not an item goes on in the same item
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !RE_ITEM.test(lines[i])) {
            li.appendChild(txt(" "));
            inline(lines[i].trim(), li);
            i++;
          }
        }
        parent.appendChild(list);
        continue;
      }
      if (RE_BLANK.test(line)) { i++; continue; }
      // a paragraph: up to a blank line or the start of another block
      var para = [];
      while (i < lines.length && !RE_BLANK.test(lines[i]) && !startsBlock(lines[i]) && !tableAt(lines, i)) { para.push(lines[i]); i++; }
      var p = el("p");
      para.forEach(function (l, k) {
        if (k) { p.appendChild(el("br")); }
        inline(l.trim(), p);
      });
      parent.appendChild(p);
    }
  }
  // an answer is drawn again as its text comes: the markdown is whole at each step
  function drawAnswer(node) {
    node.textContent = "";
    blocks(node.raw, node);
  }

  function add(cls, s) {
    var d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = s; // never innerHTML: the model's text is not markup
    log.appendChild(d);

      else { projFail(res); }

  document.getElementById("projdelete").addEventListener("click", function () {

  // the agents of the user: a new enrollment token (shown once, copied to the agent's machine), the

  function agentsCall(path, body) {
    var opts = { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" } };
    if (body) { opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function (r) {

  function agentsLoad() {

    agentlist.textContent = "";
    (d.agents || []).forEach(function (a) {

  document.getElementById("agentnew").addEventListener("click", function () {

  document.getElementById("jobrun").addEventListener("click", function () {

  var apienroll = document.getElementById("apienroll");
  var apitokenbox = document.getElementById("apitokenbox");
  document.getElementById("apinew").addEventListener("click", function () {
    fetch("/auth/api/token?aud=flm", { method: "POST" }).then(function (r) {
      if (!r.ok) { throw new Error(r.status === 401 ? "not logged in" : "no API token (" + r.status + ")"); }
      return r.json();

    }).catch(function (err) { apinote.textContent = String(err); });

  // the state names the current model: selected, added first when the list lacks it
  function setCurrent(current) {
    if (!current) { return; }
    var has = Array.prototype.some.call(model.options, function (o) { return o.value === current; });
    if (!has) {
      var o = document.createElement("option");
      o.value = current;
      o.textContent = current;
      model.insertBefore(o, model.firstChild);
    }
    model.value = current;
  }

  function setState(s) {
    setCurrent(s.model);
    // the session, with its project in front: account/project/session (the root has no account)
    status.textContent = s.session ? "session " + (s.project ? s.project + "/" : "") + s.session : "";
    setVoice(s.voice);
  }

  var es = new EventSource("/events");
  es.onopen = function () { status.textContent = "connected"; };
  es.onerror = function () { status.textContent = "disconnected, retrying…"; };
  es.addEventListener("state", function (e) { setState(JSON.parse(e.data)); });
  // the model changed the look: a name of the list, applied for this page only
  es.addEventListener("theme", function (e) { setTheme(JSON.parse(e.data).text, false); });
  // the model the chat uses now (a switch made in a turn takes effect at the next one)
  es.addEventListener("model", function (e) { setCurrent(JSON.parse(e.data).text); });
  es.addEventListener("models", function (e) {
    var d = JSON.parse(e.data);
    setModel(d.current, d.list || []);
  });
  es.addEventListener("sessions", function (e) {
    var d = JSON.parse(e.data);
    setSessions(d.current, d.list || [], d.busy || []);
    setProjects(d.project, d.projects || []);
  });
  // the sessions whose turns run now (a mark in the list): the others are not shown here
  es.addEventListener("busy", function (e) {
    setSessions(undefined, undefined, JSON.parse(e.data).list || []);
  });
  // the conversation of the session, drawn again on connect and after a switch
  es.addEventListener("history", function (e) {
    var d = JSON.parse(e.data);
    log.textContent = "";
    waitHide();
    thinkEnd();
    current = null;
    if (d.more) { add("usage", "earlier messages of this session are not shown"); }
    (d.messages || []).forEach(function (m) {
      if (m.role === "user") { add("user", m.text); return; }
      // a tool call of the chat: its line and its result, drawn as the live ones are
      if (m.role === "tool") {
        add("tool", m.text);
        if (m.result !== undefined && m.result !== null) { add("result", m.result); }
        current = null;
        return;
      }

      if (m.thinking) { thinkStart(); thinkAdd(m.thinking); thinkDone("thought"); }

  // thinking: a block with a spinner and the count of characters while it
  // comes; a click on it shows the text. It stops when the answer starts.
  var FRAMES = ["\u280b", "\u2819", "\u2839", "\u2838", "\u283c", "\u2834", "\u2826", "\u2827", "\u2807", "\u280f"];
  var think = null; // {box, spin, label, count, body, chars, started, timer}
  function thinkStart() {
    var box = document.createElement("div");
    box.className = "msg thinking";
    var head = document.createElement("button");
    head.type = "button";
    head.className = "think-head";
    head.setAttribute("aria-expanded", "false");
    var spin = document.createElement("span");
    spin.className = "think-spin";
    var label = document.createElement("span");
    label.textContent = "thinking";
    var count = document.createElement("span");
    count.textContent = " \u00b7 0 chars";
    head.appendChild(spin);
    head.appendChild(label);
    head.appendChild(count);
    var body = document.createElement("div");
    body.className = "think-body";
    body.hidden = true;
    head.addEventListener("click", function () {
      body.hidden = !body.hidden;
      head.setAttribute("aria-expanded", String(!body.hidden));
    });
    box.appendChild(head);
    box.appendChild(body);
    log.appendChild(box);
    var i = 0;
    spin.textContent = FRAMES[0];
    var timer = setInterval(function () { i = (i + 1) % FRAMES.length; spin.textContent = FRAMES[i]; }, 90);
    think = {box: box, spin: spin, label: label, count: count, body: body, chars: 0, started: Date.now(), timer: timer};
  }
  // waiting: shown while a request has no answer yet (a model can take a while);
  // it stops at the first text, thinking or tool line, or when the turn ends
  var waitEl = document.getElementById("wait");
  var waitSpin = document.getElementById("wait-spin");
  var waitLabel = document.getElementById("wait-label");
  var waitTimer = null, waitI = 0, waitFrom = 0, waitBase = "";
  function waitTick() {
    waitI = (waitI + 1) % FRAMES.length;
    waitSpin.textContent = FRAMES[waitI];
    waitLabel.textContent = waitBase + " · " + Math.floor((Date.now() - waitFrom) / 1000) + "s";
  }
  function waitShow(label) {
    waitBase = label;
    waitFrom = Date.now();
    waitEl.hidden = false;
    if (!waitTimer) { waitTimer = setInterval(waitTick, 90); }
    waitTick();
  }
  function waitHide() {
    if (waitTimer) { clearInterval(waitTimer); waitTimer = null; }
    waitEl.hidden = true;
  }
  function thinkAdd(t) {

    think.raw = (think.raw || "") + t;
    think.body.textContent = "";
    blocks(think.raw, think.body); // the thinking is markdown too
    think.chars += t.length;
    think.count.textContent = " \u00b7 " + think.chars + " chars";
    window.scrollTo(0, document.body.scrollHeight);
  }

    think.label.textContent = label;

  }

    if (!think) { return; }

    think.spin.textContent = "\u2713";
    think.label.textContent = "thought for " + ((Date.now() - think.started) / 1000).toFixed(1) + "s";

  }

  es.addEventListener("wait", function (e) {
    waitShow(JSON.parse(e.data).text);
  });
  es.addEventListener("text", function (e) {

    drawAnswer(current);
    window.scrollTo(0, document.body.scrollHeight);
  });

    thinkAdd(JSON.parse(e.data).text);
  });
  // what the recognizer heard: the message as the chat gets it
  es.addEventListener("heard", function (e) {
    add("user", JSON.parse(e.data).text);
  });
  // the usage of an answer is a tag on it, with a revert; without an answer of this turn, a line
  function turnAnswer() {
    for (var i = log.children.length - 1; i >= 0; i--) {
      var c = log.children[i];
      if (c.classList.contains("user")) { return null; }
      if (c.classList.contains("answer")) { return c; }
    }
    return null;
  }
  function exchangesFrom(answer) {
    // the exchange of the answer: its user message and what follows, to the end of the chat
    var kids = Array.prototype.slice.call(log.children), i = kids.indexOf(answer), u = -1;
    for (var k = i; k >= 0; k--) { if (kids[k].classList.contains("user")) { u = k; break; } }
    var from = u < 0 ? 0 : u;
    return kids.slice(from).filter(function (c) { return c.classList.contains("user"); }).length;
  }
  function revertFrom(answer) {
    var n = exchangesFrom(answer);
    if (!confirm(n === 1 ? "take this exchange out of the chat?" : "take this exchange and the " + (n - 1) + " after it out of the chat?")) { return; }
    fetch("/rewind", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ n: n }) }).then(function (r) {
        if (!r.ok) { return r.json().catch(function () { return {}; }).then(function (d) { add("error", d.error || "not taken out"); }); }
      }).catch(function () { add("error", "the chat does not answer"); });
  }

    thinkEnd();
    add("result", JSON.parse(e.data).text);

  });

  });

  });

  // Enter sends, Shift+Enter is a new line (not while an IME is composing)
  text.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {

  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var s = text.value.trim();
    if (!s) { return; }
    add("user", s);
    text.value = "";
    fetch("/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },

    }).then(function (r) {
      if (!r.ok) { return r.json().then(function (j) { add("error", j.error || r.statusText); }); }
    }).catch(function (err) { add("error", String(err)); });
  });

  // speech: the browser records 16 kHz mono and sends it as WAV; the server
  // recognizes it and the text goes to the chat as soon as it is ready
  function startRec() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      add("error", "no microphone here: the page must be on localhost or https");
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true } }).then(function (stream) {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC({ sampleRate: 16000 });
      var src = ctx.createMediaStreamSource(stream);
      var proc = ctx.createScriptProcessor(4096, 1, 1);
      var chunks = [];
      proc.onaudioprocess = function (ev) { chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0))); };
      src.connect(proc);
      proc.connect(ctx.destination);
      rec = { stream: stream, ctx: ctx, src: src, proc: proc, chunks: chunks };
      mic.classList.add("rec");
      mic.setAttribute("aria-pressed", "true");
    }).catch(function (err) { add("error", "microphone: " + err.message); });
  }

  function stopRec() {
    var r = rec;
    rec = null;
    mic.classList.remove("rec");
    mic.setAttribute("aria-pressed", "false");
    r.proc.disconnect();
    r.src.disconnect();
    r.stream.getTracks().forEach(function (t) { t.stop(); });

    r.ctx.close();
    var wav = encodeWav(r.chunks, rate);
    fetch("/voice", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav }).then(function (resp) {
      if (!resp.ok) { return resp.json().then(function (j) { add("error", j.error || resp.statusText); }); }
    }).catch(function (err) { add("error", String(err)); });
  }

  // 16-bit PCM WAV, mono
  function encodeWav(chunks, rate) {
    var n = 0;
    chunks.forEach(function (c) { n += c.length; });
    var buf = new ArrayBuffer(44 + n * 2);
    var v = new DataView(buf);
    function str(off, s) { for (var i = 0; i < s.length; i++) { v.setUint8(off + i, s.charCodeAt(i)); } }
    str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, n * 2, true);
    var off = 44;
    chunks.forEach(function (c) {
      for (var i = 0; i < c.length; i++) {
        var x = Math.max(-1, Math.min(1, c[i]));
        v.setInt16(off, x < 0 ? x * 0x8000 : x * 0x7fff, true);
        off += 2;
      }
    });
    return new Blob([buf], { type: "audio/wav" });
  }

  // the menu: the ☰ button opens it; a click outside or Escape closes it
  var menuBtn = document.getElementById("menu-btn"), menu = document.getElementById("menu");
  var menuTimer = null;
  menuBtn.addEventListener("click", function (ev) {
    ev.stopPropagation();
    var open = !menu.classList.contains("open");
    menu.classList.toggle("open", open);
    menuBtn.setAttribute("aria-expanded", String(open));
    // the agents' state is kept fresh while the menu is open
    if (open) {
      agentsLoad();
      clearInterval(menuTimer);
      menuTimer = setInterval(function () {
        if (menu.classList.contains("open")) { agentsLoad(); return; }
        clearInterval(menuTimer); menuTimer = null; // closed another way (outside click, Escape)
      }, 10000);
    }
  });
  document.addEventListener("click", function (ev) {
    if (!menu.contains(ev.target)) { menu.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { menu.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); }
  });

  mic.addEventListener("click", function () {
    if (rec) { stopRec(); } else { startRec(); }
  });
  mic.disabled = true; // until the state says the recognizer is there

  abort.addEventListener("click", function () {
    fetch("/abort", { method: "POST" });
  });
  // a login on another device: a QR code (the server makes it for this session, two minutes, once)
  var qrbox = document.getElementById("qrbox"), qrimg = document.getElementById("qrimg"), qrnote = document.getElementById("qrnote");
  function qrClose() { qrbox.hidden = true; qrimg.removeAttribute("src"); }
  document.getElementById("qrclose").addEventListener("click", qrClose);
  document.getElementById("qrnew").addEventListener("click", function () {
    fetch("/auth/qr/new", { method: "POST", credentials: "same-origin" }).then(function (r) {
      if (!r.ok) { return r.text().then(function (t) { add("error", t.trim() || "no code"); }); }
      return r.json().then(function (d) {
        qrimg.src = "data:image/svg+xml;base64," + btoa(d.svg);
        qrnote.textContent = "scan it with the phone within " + d.ttl + " seconds, then confirm there";
        qrbox.hidden = false;
      });
    }).catch(function () { add("error", "the chat does not answer"); });
  });
  // the current session gets another name (letters, digits, . _ -); the page follows the server's events
  document.getElementById("renamesession").addEventListener("click", function () {
    if (!sessCur) { return; }
    var to = prompt("new name for this session (letters, digits, . _ -)", sessCur);
    if (to === null || to === "" || to === sessCur) { return; }
    fetch("/session/rename", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: sessCur, to: to }) }).then(function (r) {
        if (!r.ok) { return r.json().catch(function () { return {}; }).then(function (d) { add("error", d.error || "not renamed"); }); }
      }).catch(function () { add("error", "the chat does not answer"); });
  });
  // the current session goes, with its conversation: asked first; the page follows the server's events
  document.getElementById("delsession").addEventListener("click", function () {
    if (!sessCur) { return; }
    if (!confirm("delete this session and its conversation? It cannot be undone.")) { return; }
    fetch("/session/delete", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: sessCur }) }).then(function (r) {
        if (!r.ok) { return r.json().catch(function () { return {}; }).then(function (d) { add("error", d.error || "not deleted"); }); }
      }).catch(function () { add("error", "the chat does not answer"); });
  });
  // the login ends here (the session is revoked at the auth service); the login page after it
  document.getElementById("logout").addEventListener("click", function () {
    fetch("/auth/logout", { method: "POST", credentials: "same-origin" })
      .catch(function () { /* the page goes to the login anyway */ })
      .then(function () { location.href = "/login.html"; });
  });
})();
</script>
</body>
</html>
