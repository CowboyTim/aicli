<!doctype html>
<html lang="en" data-look="simple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aicli</title>
<style>
  /* two looks, set on <html data-look>: "simple" (the terminal: plain text, "> "
     in front of what you wrote) and "cards" (bubbles). Colours follow the system
     theme, or data-theme on <html> when set. */
  :root {
    --bg: #ffffff; --fg: #1c1c1a; --muted: #6b6b66; --line: #d9d9d3;
    --user-bg: #e8f0fb; --err: #b3261e; --accent: #1c1c1a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101010; --fg: #d8d8d4; --muted: #8a8a84; --line: #333330;
      --user-bg: #1f2a36; --err: #ff8a80; --accent: #d8d8d4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101010; --fg: #d8d8d4; --muted: #8a8a84; --line: #333330;
    --user-bg: #1f2a36; --err: #ff8a80; --accent: #d8d8d4;
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }

  header { position: sticky; top: 0; z-index: 1; display: flex; gap: 12px; align-items: center; justify-content: space-between;
           padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--bg); color: var(--muted); font-size: 13px; }
  header select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
  #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  #log { overflow-wrap: anywhere; }
  .msg { margin: 0 0 14px; white-space: pre-wrap; }
  .error { color: var(--err); }
  .think { color: var(--muted); font-style: italic; }
  .tool { color: var(--accent); font-size: 13px; margin-top: 8px; }
  .result { color: var(--muted); font-size: 13px; margin-left: 1.5em; }
  .usage { color: var(--muted); font-size: 13px; }

  /* simple: the terminal */
  html[data-look="simple"] body { font-family: var(--mono); font-size: 14px; line-height: 1.5; }
  html[data-look="simple"] header { font-family: var(--mono); }
  html[data-look="simple"] .user { color: var(--accent); margin-top: 18px; }
  html[data-look="simple"] .user::before { content: "> "; color: var(--muted); }
  html[data-look="simple"] .answer { margin-bottom: 4px; }
  html[data-look="simple"] form { font-family: var(--mono); }
  html[data-look="simple"] textarea { font: inherit; font-size: 14px; border: none; border-top: 1px solid var(--line); border-radius: 0; padding: 10px 0 0; }
  html[data-look="simple"] button { border: none; background: none; color: var(--muted); padding: 0 8px; }
  html[data-look="simple"] button:hover:not(:disabled) { color: var(--fg); }

  /* cards: bubbles */
  html[data-look="cards"] .user { background: var(--user-bg); padding: 8px 12px; border-radius: 8px; }
  html[data-look="cards"] .answer { padding: 0 2px; }

  form { position: sticky; bottom: 0; background: var(--bg); display: flex; gap: 8px; padding: 12px 0; }
  textarea { flex: 1; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); resize: vertical; min-height: 44px; }
  button { font: inherit; padding: 0 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<header>
  <span id="status">connecting…</span>
  <span>
    <span id="model"></span>
    <select id="look" aria-label="look">
      <option value="simple">simple</option>
      <option value="cards">cards</option>
    </select>
  </span>
</header>
<main>
  <div id="log"></div>
  <form id="form">
    <textarea id="text" rows="2" placeholder="Message" aria-label="message"></textarea>
    <button id="mic" type="button" aria-pressed="false" title="speak (click to start, click to stop)">mic</button>
    <button id="send" type="submit">Send</button>
    <button id="abort" type="button" disabled>Stop</button>
  </form>
</main>
<script>
(function () {
  "use strict";
  var log = document.getElementById("log");
  var status = document.getElementById("status");
  var model = document.getElementById("model");
  var form = document.getElementById("form");
  var text = document.getElementById("text");
  var send = document.getElementById("send");
  var abort = document.getElementById("abort");
  var look = document.getElementById("look");
  var mic = document.getElementById("mic");
  var rec = null; // the recording in progress: {stream, ctx, src, proc, chunks}
  var current = null;  // the element the answer streams into
  var thinking = null; // the element the thinking streams into

  // the look is a per-browser choice, remembered when the browser allows it
  function setLook(name) {
    if (name !== "cards") { name = "simple"; }
    document.documentElement.setAttribute("data-look", name);
    look.value = name;
    try { localStorage.setItem("aicli-look", name); } catch (e) { /* no storage: the default */ }
  }
  var saved = null;
  try { saved = localStorage.getItem("aicli-look"); } catch (e) { /* no storage */ }
  setLook(saved || "simple");
  look.addEventListener("change", function () { setLook(look.value); });

  function add(cls, s) {
    var d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = s; // never innerHTML: the model's text is not markup
    log.appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
    return d;
  }

  function setState(s) {
    model.textContent = s.model || "";
    status.textContent = s.session ? "session " + s.session : "";
  }

  var es = new EventSource("/events");
  es.onopen = function () { status.textContent = "connected"; };
  es.onerror = function () { status.textContent = "disconnected, retrying…"; };
  es.addEventListener("state", function (e) { setState(JSON.parse(e.data)); });
  es.addEventListener("text", function (e) {
    var t = JSON.parse(e.data).text;
    if (!current) { current = add("answer", ""); }
    current.textContent += t;
    window.scrollTo(0, document.body.scrollHeight);
  });
  es.addEventListener("think", function (e) {
    var t = JSON.parse(e.data).text;
    if (!thinking) { thinking = add("think", ""); }
    thinking.textContent += t;
    window.scrollTo(0, document.body.scrollHeight);
  });
  // what the recognizer heard: the message as the chat gets it
  es.addEventListener("heard", function (e) {
    add("user", JSON.parse(e.data).text);
  });
  es.addEventListener("usage", function (e) {
    add("usage", JSON.parse(e.data).text);
  });
  // a tool line or its result is a block of its own: the next text starts a new one
  es.addEventListener("tool", function (e) {
    add("tool", JSON.parse(e.data).text);
    current = null;
    thinking = null;
  });
  es.addEventListener("result", function (e) {
    add("result", JSON.parse(e.data).text);
    current = null;
  });
  es.addEventListener("status", function (e) {
    add("usage", JSON.parse(e.data).text);
  });
  es.addEventListener("failed", function (e) {
    if (e.data) { add("error", JSON.parse(e.data).text); }
  });
  es.addEventListener("turn", function (e) {
    var st = JSON.parse(e.data).state;
    send.disabled = st === "start";
    abort.disabled = st !== "start";
    current = null;
    thinking = null;
  });

  // Enter sends, Shift+Enter is a new line (not while an IME is composing)
  text.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
      ev.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var s = text.value.trim();
    if (!s) { return; }
    add("user", s);
    text.value = "";
    fetch("/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: s })
    }).then(function (r) {
      if (!r.ok) { return r.json().then(function (j) { add("error", j.error || r.statusText); }); }
    }).catch(function (err) { add("error", String(err)); });
  });

  // speech: the browser records 16 kHz mono and sends it as WAV; the server
  // recognizes it and the text goes to the chat as soon as it is ready
  function startRec() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      add("error", "no microphone here: the page must be on localhost or https");
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true } }).then(function (stream) {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC({ sampleRate: 16000 });
      var src = ctx.createMediaStreamSource(stream);
      var proc = ctx.createScriptProcessor(4096, 1, 1);
      var chunks = [];
      proc.onaudioprocess = function (ev) { chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0))); };
      src.connect(proc);
      proc.connect(ctx.destination);
      rec = { stream: stream, ctx: ctx, src: src, proc: proc, chunks: chunks };
      mic.textContent = "stop";
      mic.setAttribute("aria-pressed", "true");
    }).catch(function (err) { add("error", "microphone: " + err.message); });
  }

  function stopRec() {
    var r = rec;
    rec = null;
    mic.textContent = "mic";
    mic.setAttribute("aria-pressed", "false");
    r.proc.disconnect();
    r.src.disconnect();
    r.stream.getTracks().forEach(function (t) { t.stop(); });
    var rate = r.ctx.sampleRate;
    r.ctx.close();
    var wav = encodeWav(r.chunks, rate);
    fetch("/voice", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav }).then(function (resp) {
      if (!resp.ok) { return resp.json().then(function (j) { add("error", j.error || resp.statusText); }); }
    }).catch(function (err) { add("error", String(err)); });
  }

  // 16-bit PCM WAV, mono
  function encodeWav(chunks, rate) {
    var n = 0;
    chunks.forEach(function (c) { n += c.length; });
    var buf = new ArrayBuffer(44 + n * 2);
    var v = new DataView(buf);
    function str(off, s) { for (var i = 0; i < s.length; i++) { v.setUint8(off + i, s.charCodeAt(i)); } }
    str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, n * 2, true);
    var off = 44;
    chunks.forEach(function (c) {
      for (var i = 0; i < c.length; i++) {
        var x = Math.max(-1, Math.min(1, c[i]));
        v.setInt16(off, x < 0 ? x * 0x8000 : x * 0x7fff, true);
        off += 2;
      }
    });
    return new Blob([buf], { type: "audio/wav" });
  }

  mic.addEventListener("click", function () {
    if (rec) { stopRec(); } else { startRec(); }
  });

  abort.addEventListener("click", function () {
    fetch("/abort", { method: "POST" });
  });
})();
</script>
</body>
</html>
