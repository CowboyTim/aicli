<!doctype html>
<html lang="en" data-look="simple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aicli login</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/theme.css">
<style>
  /* the layout of the login only: the colours come from theme.css, the same as the chat's */
  [hidden] { display: none !important; } /* the form's display rule would keep a hidden form */
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--sans); }
  html[data-look="simple"] body { font-family: var(--mono); font-size: 16px; }
  form { max-width: 320px; margin: 10vh auto; display: grid; gap: 12px; }
  label { display: grid; gap: 4px; color: var(--muted); font-size: 14px; }
  input, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  button { background: var(--user-bg); color: var(--accent); cursor: pointer; }
  #err { color: var(--err); min-height: 1.2em; font-size: 14px; }
  #qrask { max-width: 320px; margin: 10vh auto; } #qrask .row { display: flex; gap: 8px; }
  /* the password with its eye: the button sits on the input's line, as tall as the input */
  .pw { display: flex; gap: 6px; align-items: stretch; } .pw label { flex: 1; min-width: 0; }
  #peek { display: flex; align-items: center; padding: 6px 8px; color: var(--muted); }
  #peek svg { width: 18px; height: 18px; } #peek[aria-pressed="true"] { color: var(--accent); }
</style>
</head>
<body>
<div id="qrask" hidden>
  <p>Log in this device as <b id="qruser"></b>?</p>
  <div class="row"><button id="qryes" type="button">log in</button> <button id="qrno" type="button">cancel</button></div>
</div>
<form id="f" method="post" action="/auth/login">
  <label>User <input name="user" autocomplete="off" required autofocus></label>
  <div class="pw">
    <label>Password <input id="pw" name="password" type="password" autocomplete="off" required></label>
    <button type="button" id="peek" aria-label="show password" title="show password" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <button>Log in</button>
  <div id="err" role="alert"></div>
</form>
<script>
// the theme and the look of the chat (the same settings in this browser)
(function () {
  try {
    var t = localStorage.getItem("aicli-theme"), l = localStorage.getItem("aicli-look");
    if (t) { document.documentElement.setAttribute("data-theme", t); }
    if (l) { document.documentElement.setAttribute("data-look", l); }
  } catch (e) { /* no storage: the system's */ }
})();
// a login from another device: the QR code of a logged-in browser (#qr=TICKET, not sent anywhere
// but here). The ticket is asked about (peek: nothing used) and used only when the user confirms.
var qrTicket = null;
var qrMatch = location.hash.match(/^#qr=([A-Za-z0-9_-]{20,})$/);
if (qrMatch) {
  qrTicket = qrMatch[1];
  history.replaceState(null, "", "/login.html");
  document.getElementById("f").hidden = true;
  var askErr = document.getElementById("err");
  fetch("/auth/qr/peek", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ticket: qrTicket }) }).then(function (r) {
      if (!r.ok) { throw new Error("no"); }
      return r.json();
    }).then(function (d) {
      document.getElementById("qruser").textContent = d.user;
      document.getElementById("qrask").hidden = false;
    }).catch(function () {
      askErr.textContent = "this code is not valid any more (it lasts two minutes, once): make a new one";
    });
}
document.getElementById("qryes").addEventListener("click", function () {
  var errEl = document.getElementById("err");
  fetch("/auth/qr/redeem", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ticket: qrTicket }) }).then(function (r) {
      if (r.ok) { location.href = "/"; } else { errEl.textContent = "this code is not valid any more"; }
    }).catch(function () { errEl.textContent = "the login does not answer"; });
});
document.getElementById("qrno").addEventListener("click", function () {
  qrTicket = null;
  document.getElementById("qrask").hidden = true;
  document.getElementById("f").hidden = false;
});
// the eye: the password shows as text for three seconds, then it is hidden again (or at once
// when the form is sent, or the page is left)
(function () {
  var pw = document.getElementById("pw"), peek = document.getElementById("peek"), timer = null;
  function hide() {
    clearTimeout(timer); timer = null;
    pw.type = "password"; peek.setAttribute("aria-pressed", "false");
  }
  peek.addEventListener("click", function () {
    if (timer) { hide(); return; }
    pw.type = "text"; peek.setAttribute("aria-pressed", "true");
    timer = setTimeout(hide, 3000);
  });
  document.getElementById("f").addEventListener("submit", hide);
  window.addEventListener("pagehide", hide);
})();
document.getElementById("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var d = new URLSearchParams(new FormData(ev.target));
  fetch("/auth/login", { method: "POST", body: d, credentials: "same-origin" }).then(function (r) {
    if (r.ok) { location.href = "/"; }
    else { document.getElementById("err").textContent = "wrong user or password"; }
  }).catch(function () { document.getElementById("err").textContent = "the login does not answer"; });
});
</script>
</body>
</html>
