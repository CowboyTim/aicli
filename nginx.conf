worker_processes 2;
error_log /dev/stdout warn;
pid /run/nginx.pid;

env TZ=GMT;
env LC_ALL=C.UTF-8;
env LANG=en_US.UTF-8;
env PERL5LIB;

load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ndk_http_module.so;
load_module modules/ngx_http_lua_module.so;
load_module modules/ngx_http_perl_module.so;
load_module modules/ngx_http_auth_jwt_module.so;

include /usr/lib/nginx/modules/*.conf;
events {
    worker_connections 512;
}

http {
    server_tokens off;
    more_clear_headers Server;
    include /etc/nginx/mime.types;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;
    error_log   /dev/stdout;
    tcp_nopush          on;
    tcp_nodelay         on;
    types_hash_max_size 4096;
    proxy_cache_path /dev/shm levels=1 keys_zone=jwk:1m max_size=10m;

    limit_req_zone $binary_remote_addr zone=m_api:1m rate=2r/s;
    limit_req zone=m_api burst=10 delay=5;
    limit_req_log_level warn;
    limit_req_status 429;

    perl_modules /usr/lib/perl5/vendor_perl/x86_64-linux-thread-multi/;
    perl_modules /app/lib/perl/;
    perl_require qr.pm;

    server {
        listen [::]:80 default_server;
        return 301 https://$host$request_uri;
    }

    server {
        listen [::]:443 ssl;
        server_name _;

        sendfile                  on;
        gzip                      on;
        gzip_proxied              no-cache no-store private expired auth;

        ssl_certificate           "/etc/nginx/certs/live/$ssl_server_name/fullchain.pem";
        ssl_certificate_key       "/etc/nginx/certs/live/$ssl_server_name/privkey.pem";
        ssl_session_cache         shared:SSL:1m;
        ssl_session_timeout       10m;
        ssl_protocols             TLSv1.3;
        ssl_ciphers               ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_verify_depth          1;

        # Enable OCSP stapling
        # ref. http://blog.mozilla.org/security/2013/07/29/ocsp-stapling-in-firefox
        ssl_stapling              on;
        ssl_stapling_verify       on;

        tcp_nodelay               on;
        client_max_body_size      16k;
        ignore_invalid_headers    on;
        chunked_transfer_encoding off;
        sendfile_max_chunk        1m;
        send_timeout              5s;
        client_header_buffer_size 1k;
        client_body_buffer_size   4k;
        client_body_timeout       5s;
        client_header_timeout     5s;
        client_body_in_single_buffer on;
        large_client_header_buffers  2 1k;
        connection_pool_size         512;
        autoindex off;
        resolver 127.0.0.11 ipv6=off valid=3s;
        resolver_timeout 5s;

        root /app/site/;

        if ($request_method !~ ^(GET|POST)$) {
            return 444;
        }

        # Aditional Security Headers
        # https://www.sentrium.co.uk/labs/application-security-101-http-headers

        # don't add a add_header in a "location" for nginx,
        # else the other will be gone, there's no merging
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Xss-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self'; frame-ancestors 'self'" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";

        default_type       "";
        keepalive_timeout  65;
        keepalive_requests 100;

        more_clear_headers Server;
        more_clear_headers Date;
        more_clear_headers X-Powered-By;
        etag on;

        location /err40x.html {
            internal;
            content_by_lua_block {
                ngx.say("");
            }
        }
        location /err50x.html {
            internal;
            content_by_lua_block {
                ngx.say("");
            }
        }
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            add_header Cache-Control "max-age=86400" always;
            try_files /favicon.ico =404;
        }

        location ~ ^/qr$ {
            etag off;
            limit_req zone=m_api burst=5 nodelay;
            perl qr::generate;
        }

        error_page 401 = @error401;
        location @error401 {
            internal;
            return 302 /login;
        }

        location / {
            access_log off;
            satisfy any;
            try_files /index.html /index.html;
        }

        location ~* \.(css|js|png|ico)$ {
            access_log off;
            expires 1h;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location ~ /.+$ {
            # add 1 add_header to clear the entire list
            add_header "Content-Type" "";
            # explicitly clear the headers auto set by nginx
            more_clear_headers "Content-Length";
            more_clear_headers "Content-Type";
            more_clear_headers "Connection";
            more_clear_headers "Transfer-Encoding";
            return 404 /err40x.html;
        }
    }
}
